name: Deploy to Server

on:
  push:
    branches:
      - master  # Продакшн
      - dev     # Тестовый сервер

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    name: Deploy to Production
    
    steps:
    - name: Deploy to production server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          echo "Starting PRODUCTION deployment..."
          cd /var/www/crater || { echo "Directory not found! Creating..."; mkdir -p /var/www/crater; cd /var/www/crater; git clone https://github.com/ataizhu/crater_saas.git . || exit 1; }
          echo "Current directory: $(pwd)"
          git fetch origin
          git reset --hard origin/master
          echo "Current branch: $(git branch --show-current)"
          echo "Code updated, building containers..."
          docker compose up -d --build
          echo "Fixing storage permissions..."
          docker compose exec -u root app chmod -R 775 /var/www/storage /var/www/bootstrap/cache || true
          docker compose exec -u root app chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache || true
          echo "Generating application key if not set..."
          docker compose exec -u root app php artisan key:generate --force || true
          echo "Clearing config cache before migration..."
          docker compose exec -u root app php artisan config:clear || true
          docker compose exec -u root app rm -rf /var/www/bootstrap/cache/*.php || true
          docker compose exec -u root app rm -rf /var/www/storage/framework/cache/* || true
          docker compose exec -u root app rm -rf /var/www/storage/framework/views/* || true
          echo "Fixing permissions again before migrations..."
          docker compose exec -u root app chmod -R 775 /var/www/storage /var/www/bootstrap/cache || true
          docker compose exec -u root app chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache || true
          echo "Creating admin schema if not exists..."
          docker compose exec db psql -U crater -d crater_saas -c "CREATE SCHEMA IF NOT EXISTS admin;" || true
          docker compose exec db psql -U crater -d crater_saas -c "GRANT ALL ON SCHEMA admin TO crater;" || true
          docker compose exec db psql -U crater -d crater_saas -c "ALTER DATABASE crater_saas SET search_path TO admin;" || true
          
          echo "Setting search_path for current session before migrations..."
          docker compose exec -u root app php artisan tinker --execute="DB::statement('SET search_path TO admin'); echo 'search_path set to admin';" || true
          
          echo "Checking existing tables in admin schema..."
          docker compose exec db psql -U crater -d crater_saas -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'admin' ORDER BY table_name;" || true
          
          echo "Checking if migrations table exists..."
          docker compose exec db psql -U crater -d crater_saas -c "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_schema = 'admin' AND table_name = 'migrations');" || true
          
          echo "Running migrations..."
          docker compose exec -u root app php artisan migrate --force || true
          
          echo "Verifying tables were created after migrations..."
          docker compose exec db psql -U crater -d crater_saas -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'admin' ORDER BY table_name;" || true
          
          echo "Checking if users table exists (critical for login)..."
          docker compose exec db psql -U crater -d crater_saas -c "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_schema = 'admin' AND table_name = 'users');" || true
          
          echo "Creating missing tables manually if migrations failed..."
          docker compose exec db psql -U crater -d crater_saas -c "SET search_path TO admin; CREATE TABLE IF NOT EXISTS tenants (id VARCHAR(255) PRIMARY KEY, name VARCHAR(255), owner_name VARCHAR(255), owner_email VARCHAR(255), owner_password VARCHAR(255), created_at TIMESTAMP, updated_at TIMESTAMP, data JSONB);" || true
          docker compose exec db psql -U crater -d crater_saas -c "SET search_path TO admin; CREATE TABLE IF NOT EXISTS domains (id SERIAL PRIMARY KEY, domain VARCHAR(255) UNIQUE NOT NULL, tenant_id VARCHAR(255) NOT NULL, created_at TIMESTAMP, updated_at TIMESTAMP);" || true
          docker compose exec db psql -U crater -d crater_saas -c "SET search_path TO admin; CREATE TABLE IF NOT EXISTS users (id BIGSERIAL PRIMARY KEY, name VARCHAR(255) NOT NULL, email VARCHAR(255) UNIQUE NOT NULL, password VARCHAR(255) NOT NULL, remember_token VARCHAR(100), created_at TIMESTAMP, updated_at TIMESTAMP);" || true
          docker compose exec db psql -U crater -d crater_saas -c "SET search_path TO admin; CREATE TABLE IF NOT EXISTS cache (key VARCHAR(255) PRIMARY KEY, value TEXT, expiration INTEGER);" || true
          docker compose exec db psql -U crater -d crater_saas -c "SET search_path TO admin; CREATE TABLE IF NOT EXISTS cache_locks (key VARCHAR(255) PRIMARY KEY, owner VARCHAR(255), expiration INTEGER);" || true
          docker compose exec db psql -U crater -d crater_saas -c "GRANT ALL ON ALL TABLES IN SCHEMA admin TO crater;" || true
          docker compose exec db psql -U crater -d crater_saas -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA admin TO crater;" || true
          
          echo "Final verification of critical tables..."
          docker compose exec db psql -U crater -d crater_saas -c "SELECT table_name, (SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = 'admin' AND table_name = t.table_name) as column_count FROM information_schema.tables t WHERE t.table_schema = 'admin' AND t.table_name IN ('users', 'tenants', 'domains', 'cache', 'cache_locks', 'migrations') ORDER BY table_name;" || true
          echo "Creating test admin user if not exists..."
          docker compose exec -u root app php artisan admin:create "Admin" "admin@example.com" "testtest" || echo "Admin user may already exist"
          echo "Fixing permissions again after migrations..."
          docker compose exec -u root app chmod -R 775 /var/www/storage /var/www/bootstrap/cache || true
          docker compose exec -u root app chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache || true
          echo "Fixing permissions before clearing caches..."
          docker compose exec -u root app chmod -R 775 /var/www/storage /var/www/bootstrap/cache || true
          docker compose exec -u root app chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache || true
          echo "Removing cache files manually..."
          docker compose exec -u root app rm -rf /var/www/bootstrap/cache/*.php || true
          docker compose exec -u root app rm -rf /var/www/storage/framework/cache/* || true
          docker compose exec -u root app rm -rf /var/www/storage/framework/views/* || true
          echo "Clearing database cache if exists..."
          docker compose exec db psql -U crater -d crater_saas -c "SET search_path TO admin; TRUNCATE TABLE cache; TRUNCATE TABLE cache_locks;" || true
          echo "Clearing all caches..."
          docker compose exec -u root app php artisan config:clear || true
          docker compose exec -u root app php artisan cache:clear || true
          docker compose exec -u root app php artisan route:clear || true
          docker compose exec -u root app php artisan view:clear || true
          echo "Fixing permissions after clearing caches..."
          docker compose exec -u root app chmod -R 775 /var/www/storage /var/www/bootstrap/cache || true
          docker compose exec -u root app chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache || true
          echo "Clearing Opcache by restarting PHP-FPM..."
          docker compose restart app || true
          echo "PRODUCTION deployment completed successfully!"

  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    name: Deploy to Dev Server
    
    steps:
    - name: Deploy to dev server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          echo "Starting DEV deployment..."
          cd /var/www/crater-dev || { echo "Directory not found! Creating..."; mkdir -p /var/www/crater-dev; cd /var/www/crater-dev; git clone https://github.com/ataizhu/crater_saas.git . || exit 1; }
          echo "Current directory: $(pwd)"
          git fetch origin
          git reset --hard origin/dev
          echo "Current branch: $(git branch --show-current)"
          echo "Code updated, building containers..."
          docker compose -p crater-dev -f docker-compose.dev.yml up -d --build
          echo "Installing Composer dependencies..."
          docker compose -p crater-dev -f docker-compose.dev.yml exec -u root app composer install --no-dev --optimize-autoloader || true
          echo "Fixing storage permissions..."
          docker compose -p crater-dev -f docker-compose.dev.yml exec -u root app chmod -R 775 /var/www/storage /var/www/bootstrap/cache || true
          docker compose -p crater-dev -f docker-compose.dev.yml exec -u root app chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache || true
          echo "Generating application key if not set..."
          docker compose -p crater-dev -f docker-compose.dev.yml exec -u root app php artisan key:generate --force || true
          echo "Clearing config cache before migration..."
          docker compose -p crater-dev -f docker-compose.dev.yml exec -u root app php artisan config:clear || true
          docker compose -p crater-dev -f docker-compose.dev.yml exec -u root app rm -rf /var/www/bootstrap/cache/*.php || true
          echo "Dropping database if exists..."
          docker compose -p crater-dev -f docker-compose.dev.yml exec -T db psql -U crater -c "DROP DATABASE IF EXISTS crater_saas_dev;" 2>/dev/null || \
          docker compose -p crater-dev -f docker-compose.dev.yml exec -T db psql -U postgres -c "DROP DATABASE IF EXISTS crater_saas_dev;" 2>/dev/null || \
          echo "Database may not exist or already dropped"
          
          echo "Creating fresh database..."
          docker compose -p crater-dev -f docker-compose.dev.yml exec -T db psql -U crater -c "CREATE DATABASE crater_saas_dev OWNER crater;" 2>/dev/null || \
          docker compose -p crater-dev -f docker-compose.dev.yml exec -T db psql -U postgres -c "CREATE DATABASE crater_saas_dev OWNER crater;" || true
          
          echo "Creating admin schema..."
          docker compose -p crater-dev -f docker-compose.dev.yml exec db psql -U crater -d crater_saas_dev -c "CREATE SCHEMA IF NOT EXISTS admin;" || true
          docker compose -p crater-dev -f docker-compose.dev.yml exec db psql -U crater -d crater_saas_dev -c "GRANT ALL ON SCHEMA admin TO crater;" || true
          docker compose -p crater-dev -f docker-compose.dev.yml exec db psql -U crater -d crater_saas_dev -c "ALTER DATABASE crater_saas_dev SET search_path TO admin;" || true
          
          echo "Running fresh migrations..."
          docker compose -p crater-dev -f docker-compose.dev.yml exec -u root app php artisan migrate --force || true
          echo "Creating test admin user if not exists..."
          docker compose -p crater-dev -f docker-compose.dev.yml exec -u root app php artisan admin:create "Admin" "admin@example.com" "testtest" || echo "Admin user may already exist"
          echo "Clearing caches..."
          docker compose -p crater-dev -f docker-compose.dev.yml exec -u root app php artisan config:clear || true
          docker compose -p crater-dev -f docker-compose.dev.yml exec -u root app php artisan config:cache || true
          docker compose -p crater-dev -f docker-compose.dev.yml exec -u root app php artisan route:cache || true
          docker compose -p crater-dev -f docker-compose.dev.yml exec -u root app php artisan view:cache || true
          echo "DEV deployment completed successfully!"

